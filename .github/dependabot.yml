version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # codeql-action init/autobuild/analyze must move in lockstep or the run fails
      codeql-action:
        patterns:
          - "github/codeql-action*"
